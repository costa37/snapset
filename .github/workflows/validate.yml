name: Validate SnapSet
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test layout, window matching, migration and feed metadata
        run: bash scripts/test.sh
      - name: Build arm64 app with Sparkle
        run: bash scripts/build.sh
      - name: Verify architecture and signature
        run: |
          file dist/SnapSet.app/Contents/MacOS/SnapSet
          codesign --verify --deep --strict dist/SnapSet.app
